نام: جنگو CI

بر روی:
  فشار دادن:
    شاخه ها: [ "اصلی" است است اسطات ست ]
  pull_request:
    شاخه ها: [ "اصلی" است است اسست اسات اسات ست اسات اسات ست اسات اسات اسات اسات اسات استات ]

شغل ها:
  بنا کردن:

    اجرا می شد: اوبونتوی اخرین
    ستارهاتقی:
      هداکتر معزی: 4
      ماتریکس:
        نسخه پایتون: [3.7, 3.8, 3.9]

    مراحل:
    - اساتفه می کند: اقدمات/checkout@v4
    - نام: پایتون $ را تنزیم کنید{{ matrix.python-version }}
      اساتفه می کند: اقدمات/setup-python@v3
      با با:
        نسخه پایتون: ${{ matrix.python-version }}
    - نام: وابستگمی ها را پاک کنم کند
      اجرا کنید: |
        پایتون - ام پیام نسب کنید - پیام را ارطقا دهد
        pip install -r requirements.txt
    - نام: اجرایی تست ها
      اجرا کنید: |
        TAST MEDIRIT PAITON.py
